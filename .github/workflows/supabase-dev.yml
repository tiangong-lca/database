          supabase test db supabase/tests/20261006_search_request_identity.sql
          supabase test db supabase/tests/20260920_portal_china_administrative_navigation.sql
          supabase test db supabase/tests/20260805_full_schema_cutover.sql
          supabase test db supabase/tests/20260806_api_contract_closure.sql
