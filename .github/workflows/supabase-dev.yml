name: Deploy and Verify Supabase Dev

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Each Dev push keeps its checks; later docs-only pushes cannot cancel deployment proof.
  group: supabase-dev-deployment-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  local-contract:
    name: Rebuild and verify database contract
    runs-on: ubuntu-latest
    outputs:
      deploy_required: ${{ steps.dev_scope.outputs.required }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify exact persistent Dev push scope
        if: github.event_name == 'push'
        id: dev_scope
        shell: bash
        env:
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.event.after }}
        run: |
          # Missing/new-branch bases, unexpected checkouts, and diff errors block deployment.
          [[ "$GITHUB_REF" == "refs/heads/dev" ]] || exit 1
          [[ "$PUSH_BASE_SHA" =~ ^[0-9a-f]{40}$ && "$PUSH_BASE_SHA" != "0000000000000000000000000000000000000000" ]] || exit 1
          [[ "$PUSH_HEAD_SHA" =~ ^[0-9a-f]{40}$ && "$PUSH_HEAD_SHA" == "$GITHUB_SHA" ]] || exit 1
          git cat-file -e "$PUSH_BASE_SHA^{commit}"
          git cat-file -e "$PUSH_HEAD_SHA^{commit}"
          [[ "$(git rev-parse HEAD)" == "$PUSH_HEAD_SHA" ]] || exit 1
          git merge-base --is-ancestor "$PUSH_BASE_SHA" "$PUSH_HEAD_SHA"
          diff_status=0
          git diff --quiet "$PUSH_BASE_SHA" "$PUSH_HEAD_SHA" -- \
            supabase/config.toml \
            supabase/migrations/ \
            supabase/seed.sql \
            supabase/seeds/ \
            supabase/functions/ || diff_status=$?
          case "$diff_status" in
            0)
              echo "required=false" >> "$GITHUB_OUTPUT"
              echo "No deployable Supabase changes; persistent Dev receives no authority or hosted mutation."
              ;;
            1) echo "required=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Cannot classify the exact persistent Dev push diff."; exit 1 ;;
          esac

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.117.0

      - name: Verify deployment workflow contract
        run: |
          python scripts/check_review_metadata_contract.py
          python scripts/test_resolve_migration_head.py
          python scripts/test_study_reporting_quiescence.py
          python3 scripts/test_configure_derivative_scheduler.py
          python scripts/test_supabase_dev_workflow_contract.py
          python scripts/test_portal_rank_retirement_governance.py
          python3 -B scripts/test_search_request_identity_http_contract.py
          python scripts/check_portal_projection_manifest.py
          python3 scripts/check_advisor_dispositions.py
          python3 scripts/check_portal_card_schema_parity.py
          python3 scripts/generate_portal_navigation_vocabulary.py --check
          python3 scripts/test_portal_navigation_revisions.py
          python3 scripts/build_portal_contract_types.py --check
          python3 -B -m unittest discover -s scripts -p 'test_benchmark_portal_facets_navigation*.py'
          python3 -B -m unittest discover -s scripts -p 'test_collect_portal_flow_cas_volume_upgrade.py'
          python3 -B -m unittest discover -s scripts -p 'test_collect_portal_flow_cas_writer_wal.py'
          python3 -B supabase/tests/upgrade/test_portal_facets_navigation_upgrade_profiles.py
          python3 -B supabase/tests/upgrade/test_collect_portal_flow_cas_cutover.py
          python3 -B supabase/tests/upgrade/test_collect_portal_flow_cas_ddl_fence.py

      - name: Verify offline LCA Study durable contract
        run: python3 -B supabase/tests/lca_study_durable_contract.py

      - name: Rebuild migration history
        run: supabase start && supabase db reset --no-seed

      - name: Verify generated schema and Data API types
        run: |
          python scripts/build_schema_workspace.py --environment local \
            --schemas public api private util archive
          python scripts/build_database_types.py --environment local
          git diff --exit-code -- supabase/workspace
          test -z "$(git status --porcelain --untracked-files=all -- supabase/workspace)"

      - name: Verify Scope Closure scanner admission and populated upgrade
        env:
          SCOPE_CLOSURE_UPGRADE_ALLOW_RESET: isolated
        run: |
          scripts/test_scope_closure_scanner_upgrade.sh
          supabase test db supabase/tests/20260801_scope_closure_cutoff_main_hotfix.sql
          supabase test db supabase/tests/20260724_initial_candidate_scope_closure_e2e.sql
          supabase test db supabase/tests/20260722_scope_closure_release_binding_e2e.sql
          supabase test db supabase/tests/20260722_data_product_scope_closure_and_task_feed.sql

      - name: Verify calculation export populated upgrade
        env:
          CALCULATION_EXPORT_UPGRADE_ALLOW_RESET: isolated
        run: scripts/test_calculation_export_upgrade.sh

      - name: Verify schema and capability contracts
        run: |
          supabase test db supabase/tests/20261103_study_durable_runtime.sql
          supabase test db supabase/tests/20261103_study_task_admission.sql
          supabase test db supabase/tests/20261103_study_task_disclosure.sql
          supabase test db supabase/tests/20261103_study_task_input_parity.sql
          supabase test db supabase/tests/20261103_study_analysis_reporting.sql
          supabase test db supabase/tests/20261103_study_report_producer.sql
